# Local Postgres for `npm run dev` and `npm test`. Start it with `npm run db:up`.
# Version matches the Neon project (Postgres 17) and the CI service container.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loopway
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loopway"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
