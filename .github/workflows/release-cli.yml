name: Release CLI

# Push a tag `cli-v<version>` (matching packages/cli/package.json) to release the CLI. Anyone who can push tags
# can release. The release carries the CLI and the two workspace packages it needs as npm tarballs, which
# packages/web/content/install.sh (served at /install.sh) installs.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches the CLI's version
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [ "$GITHUB_REF_NAME" != "cli-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli/package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: |
          mkdir dist-release
          npm pack -w @loopway/harnesses -w @loopway/rules -w @loopway/presets -w @loopway/cli --pack-destination dist-release
          # Fixed names, so install.sh can fetch .../releases/latest/download/loopway-cli.tgz
          for name in harnesses rules presets cli; do
            mv dist-release/loopway-$name-*.tgz dist-release/loopway-$name.tgz
          done
      - name: Install from the tarballs and run it
        run: |
          npm install -g ./dist-release/loopway-harnesses.tgz ./dist-release/loopway-rules.tgz ./dist-release/loopway-presets.tgz ./dist-release/loopway-cli.tgz
          test "$(loopway --version)" = "$(node -p 'require("./packages/cli/package.json").version')"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-release/*.tgz --title "CLI ${GITHUB_REF_NAME#cli-v}" --generate-notes
