name: Release CLI

# Push a tag `cli-v<version>` (matching packages/cli/package.json) to release the CLI. Anyone who can push tags
# can release. The release carries the CLI and the workspace packages it needs as npm tarballs, plus a
# manifest.txt listing them, which packages/web/content/install.sh (served at /install.sh) installs.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches the CLI's version
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [ "$GITHUB_REF_NAME" != "cli-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli/package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: |
          mkdir dist-release
          npm pack -w @loopway/harnesses -w @loopway/rules -w @loopway/presets -w @loopway/cli --pack-destination dist-release
          # Fixed names, so the manifest and install.sh don't need to know versions
          for name in harnesses rules presets cli; do
            mv dist-release/loopway-$name-*.tgz dist-release/loopway-$name.tgz
          done
          # install.sh installs whatever this lists
          (cd dist-release && ls loopway-*.tgz > manifest.txt)
      - name: Install with the hosted install.sh and run it
        run: |
          LOOPWAY_DOWNLOAD_URL="file://$PWD/dist-release" sh packages/web/content/install.sh
          test "$(loopway --version)" = "$(node -p 'require("./packages/cli/package.json").version')"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-release/*.tgz dist-release/manifest.txt --title "CLI ${GITHUB_REF_NAME#cli-v}" --generate-notes
