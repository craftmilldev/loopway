name: Release CLI

# Releases the CLI once CI passes on main, if the CLI has changed since the last release. The version is the next
# patch after the last `cli-v*` tag, or packages/cli/package.json's version when that is a plain x.y.z and higher, so
# a minor or major bump is made by raising it there. The release is a GitHub release tagged `cli-v<version>` carrying
# the CLI as an npm tarball (`loopway-cli.tgz`); nothing goes to npm. Run it by hand from the Actions tab to retry; it
# releases nothing when nothing changed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, and never cancel one halfway through publishing.
concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out main's tip by default; release the commit CI passed on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: List what the CLI ships
        # Tests and markdown don't change a release.
        run: |
          echo "CLI_PATHS=packages/cli :(exclude,glob)packages/*/test/** :(exclude,glob)**/*.md" >> "$GITHUB_ENV"
      - name: Decide whether to release, and the version
        id: plan
        run: |
          set -f # CLI_PATHS holds globs for git, not the shell
          last=$(git tag -l 'cli-v*' --sort=-v:refname | head -n1)
          if ! git merge-base --is-ancestor "$last" HEAD; then
            echo "$last is not in this commit's history, so a newer commit was already released" >&2
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$last" HEAD -- $CLI_PATHS; then
            echo "Nothing the CLI ships has changed since $last" >&2
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -e '
            const [lastV, pkgV] = process.argv.slice(1);
            const last = lastV.split(".").map(Number);
            // A pre-release such as 2.0.0-alpha is not a version to release; the next patch is.
            const pkg = /^\d+\.\d+\.\d+$/.test(pkgV) ? pkgV.split(".").map(Number) : last;
            const higher = pkg.findIndex((n, i) => n !== last[i]);
            console.log(higher !== -1 && pkg[higher] > last[higher] ? pkg.join(".") : `${last[0]}.${last[1]}.${last[2] + 1}`);
          ' "${last#cli-v}" "$(node -p 'require("./packages/cli/package.json").version')")
          echo "Releasing $version (last release $last)" >&2
          {
            echo "release=true"
            echo "version=$version"
            echo "last=$last"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.release == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.plan.outputs.release == 'true'
        run: npm ci
      - name: Set the version
        if: steps.plan.outputs.release == 'true'
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "packages/cli/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          ' "${{ steps.plan.outputs.version }}"
      - if: steps.plan.outputs.release == 'true'
        run: npm run build
      - name: Pack
        if: steps.plan.outputs.release == 'true'
        run: |
          mkdir dist-release
          npm pack -w @loopway/cli --pack-destination dist-release
          # A fixed name, so the release asset does not change with the version
          mv dist-release/loopway-cli-*.tgz dist-release/loopway-cli.tgz
      - name: Install the tarball and run it
        if: steps.plan.outputs.release == 'true'
        run: |
          mkdir smoke && cd smoke
          npm init -y >/dev/null
          npm install ../dist-release/loopway-cli.tgz
          test "$(npx loopway --version)" = "${{ steps.plan.outputs.version }}"
      - name: Publish the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          LAST: ${{ steps.plan.outputs.last }}
        run: |
          set -f
          # Only the commits that changed what the CLI ships, not every merge since the last release
          git log --format='- %s (%h)' "$LAST..HEAD" -- $CLI_PATHS > notes.md
          gh release create "cli-v$VERSION" dist-release/loopway-cli.tgz \
            --target "$(git rev-parse HEAD)" --title "CLI $VERSION" --notes-file notes.md
